[project]
name = "bounded-distill"
dynamic = ["version"]  # read from src/bounded_distill/__init__.py
description = "Distill your LLM classifier into a small fast model, with a statistical bound on agreement and LLM fallback for uncertain cases."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Yerassyl Pirzhanov", email = "erasil200270@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "llm",
    "distillation",
    "knowledge-distillation",
    "text-classification",
    "cascade",
    "calibration",
    "confidence-threshold",
    "label-noise",
    "cost-reduction",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.5",  # already required by scikit-learn; used for the Clopper-Pearson bound
    "sentence-transformers>=3.0",
]

[project.urls]
Homepage = "https://github.com/BenFruit/bounded-distill"
Issues = "https://github.com/BenFruit/bounded-distill/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bounded_distill/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/bounded_distill"]

[tool.hatch.build.targets.sdist]
# Leading slashes anchor the patterns to the project root (benchmarks/README.md stays out).
include = ["/src/", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.ruff]
line-length = 100
# target-version is inferred from requires-python (>=3.10).

[tool.ruff.format]
# Keep hand-aligned code samples in Markdown docs as written; format Python files only.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes: unused imports/variables, undefined names
    "I",    # isort: import order
    "UP",   # pyupgrade: modern syntax for the target Python
    "B",    # flake8-bugbear: likely bugs
    "SIM",  # flake8-simplify
    "NPY",  # numpy-specific rules (e.g. legacy np.random API)
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Tests use Russian texts on purpose; RUF001 would flag Cyrillic letters that look Latin.
"tests/**" = ["RUF001"]

[tool.pyright]
include = ["src", "tests", "benchmarks"]
typeCheckingMode = "strict"
# Check against the oldest supported Python, so newer-only syntax or APIs are reported.
pythonVersion = "3.10"
venvPath = "."
venv = ".venv"

[tool.pytest]
testpaths = ["tests"]
# Slow tests (e.g. the real embedding model download) are skipped by default;
# run them with `pytest -m slow`.
addopts = ["--strict-markers", "-m", "not slow"]
markers = ["slow: needs network or a real model; skipped by default"]

# Development environment only (not part of the published package metadata):
# install CPU-only torch so local setup and CI do not download CUDA wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv]
# `uv sync` installs the benchmark tools too, so pyright can check benchmarks/ locally and in CI.
default-groups = ["dev", "bench"]
# The version lives in __init__.py, so a change there must rebuild the installed package.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/bounded_distill/__init__.py" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
bench = [
    "matplotlib>=3.10.9",
    "openai>=3.55.1",
    "pyarrow>=25.0.1",
]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "torch>=2.14.1",
]
